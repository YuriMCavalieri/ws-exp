<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WS WALKTHROUGH — White Stone</title>
<style>
:root{--onix:#0B0D11;--onix2:#141821;--marfim:#F8F6F0;--ouro:#C9A961;--cinza:#8B857A;
  --linha:#232936;--verde:#4FA97A;--vermelho:#C96161}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--onix);color:var(--marfim);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{display:flex;height:100%}

#lado{width:330px;flex:0 0 330px;background:var(--onix2);border-right:1px solid var(--linha);
  display:flex;flex-direction:column;z-index:5;transition:margin-left .25s ease}
#lado.oculto{margin-left:-330px}
#marca{padding:18px 20px 14px;border-bottom:1px solid var(--linha)}
#marca .n{font-family:Georgia,serif;font-size:13px;letter-spacing:.34em;color:var(--ouro)}
#marca .s{font-size:10.5px;letter-spacing:.16em;color:var(--cinza);margin-top:6px;text-transform:uppercase}
#abas{display:flex;border-bottom:1px solid var(--linha)}
#abas button{flex:1;padding:13px 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--cinza);border-bottom:2px solid transparent;transition:.18s}
#abas button:hover{color:var(--marfim)}
#abas button.on{color:var(--ouro);border-bottom-color:var(--ouro);background:#181d27}
#corpo{flex:1;overflow-y:auto;padding:18px 20px 30px}
#corpo::-webkit-scrollbar{width:7px}#corpo::-webkit-scrollbar-thumb{background:#2b3242;border-radius:4px}

.sec{margin-bottom:22px}
.sec h4{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cinza);
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h4:after{content:"";flex:1;height:1px;background:var(--linha)}
.hint{font-size:11.5px;line-height:1.55;color:#9a958c}
.hint b{color:var(--marfim);font-weight:600}
.drop{border:1px dashed #39414f;border-radius:10px;padding:20px 14px;text-align:center;
  cursor:pointer;transition:.18s;background:#10141c}
.drop:hover,.drop.hot{border-color:var(--ouro);background:#181d27}
.drop .t{font-size:12.5px;margin-bottom:5px}
.drop .u{font-size:10.5px;color:var(--cinza);line-height:1.5}
.bt{display:block;width:100%;padding:11px;border-radius:8px;background:#222939;font-size:11.5px;
  transition:.18s;text-align:center;margin-top:8px}
.bt:hover{background:#2c3549}
.bt:disabled{opacity:.4;cursor:not-allowed}
.bt.ouro{background:linear-gradient(135deg,#C9A961,#a8873f);color:#14100a;font-weight:600}
.bt.ouro:hover{filter:brightness(1.09)}
.bt.mini{padding:8px;font-size:10.5px}
.lin{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:11.5px}
.lin label{flex:0 0 92px;color:var(--cinza);font-size:10.5px}
.lin input[type=range]{flex:1;accent-color:var(--ouro)}
.lin .v{flex:0 0 56px;text-align:right;color:var(--ouro);font-variant-numeric:tabular-nums;font-size:11px}
.lin select,.lin input[type=text]{flex:1;background:#10141c;border:1px solid #2b3242;
  border-radius:6px;padding:7px 9px;font-size:11.5px;min-width:0}
textarea{width:100%;background:#10141c;border:1px solid #2b3242;border-radius:8px;
  padding:9px 10px;font-size:11.5px;line-height:1.5;resize:vertical;min-height:74px}
textarea:focus{outline:none;border-color:var(--ouro)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#0a0d13;border:1px solid #2b3242}
.th img{width:100%;height:100%;object-fit:cover}
.th .rm{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;
  background:rgba(11,13,17,.85);font-size:10px;line-height:16px;text-align:center;color:#c8c2b8}
.th .rm:hover{background:var(--vermelho);color:#fff}
.th.add{display:flex;align-items:center;justify-content:center;color:#4a5262;font-size:18px;
  border-style:dashed;cursor:pointer}
.th.add:hover{border-color:var(--ouro);color:var(--ouro)}
.amb{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;background:#10141c;
  border:1px solid var(--linha);margin-bottom:7px;cursor:pointer;transition:.15s}
.amb:hover{border-color:#3a4354}
.amb.on{border-color:var(--ouro);background:#191d26}
.amb .mini{width:44px;height:26px;border-radius:4px;object-fit:cover;flex:0 0 44px;background:#0a0d13}
.amb .nm{flex:1;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amb .st{font-size:9px;color:var(--cinza);letter-spacing:.08em}
.stat{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid #1c212c}
.stat span:first-child{color:var(--cinza)}
.stat span:last-child{font-variant-numeric:tabular-nums}
.aviso{border-left:2px solid var(--ouro);padding:9px 0 9px 11px;font-size:11px;
  line-height:1.55;color:#a8a299;margin-top:10px}
.aviso.err{border-color:var(--vermelho)}
.aviso.ok{border-color:var(--verde)}
.custo{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;
  border-top:1px solid var(--linha);margin-top:14px}
.custo .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cinza)}
.custo .v{font-family:Georgia,serif;font-size:20px;color:var(--ouro)}

#visor{flex:1;position:relative;background:#05070a}
#cv{display:block;width:100%;height:100%;touch-action:none}
#topo{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;gap:8px;align-items:center;z-index:3}
#topo .cap{flex:1;font-family:Georgia,serif;font-size:14px;text-shadow:0 2px 14px #000}
#topo .selo{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#C9A961;
  border:1px solid #C9A96155;border-radius:999px;padding:3px 9px;white-space:nowrap;
  background:#0008;cursor:help;margin-right:8px}
@media(max-width:760px){#topo .selo{display:none}}
.tb{background:rgba(11,13,17,.72);backdrop-filter:blur(8px);border:1px solid var(--linha);
  border-radius:8px;padding:8px 12px;font-size:11px;transition:.18s}
.tb:hover{border-color:var(--ouro);color:var(--ouro)}
.tb.on{border-color:var(--ouro);color:var(--ouro);background:rgba(201,169,97,.12)}
#hud{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;display:flex;gap:10px;
  align-items:center;font-size:10.5px;color:#7d8697;pointer-events:none;flex-wrap:wrap}
#hud .p{background:rgba(11,13,17,.72);backdrop-filter:blur(8px);border:1px solid var(--linha);
  border-radius:7px;padding:6px 11px;font-variant-numeric:tabular-nums}
#carga{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:var(--onix);z-index:6;text-align:center;padding:36px}
#carga .m{font-family:Georgia,serif;font-size:13px;letter-spacing:.34em;color:var(--ouro)}
#carga .t{font-size:12px;letter-spacing:.08em;color:var(--cinza);max-width:420px;line-height:1.7}
#carga .b{width:220px;height:2px;background:var(--linha);border-radius:2px;overflow:hidden}
#carga .b i{display:block;height:100%;width:0;background:var(--ouro);transition:width .35s}
#carga .err{border-left:2px solid var(--vermelho);padding:10px 0 10px 12px;text-align:left;
  font-size:11.5px;line-height:1.65;color:#a8a299;max-width:470px;white-space:pre-wrap}
#faixa{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:5;display:none;
  align-items:center;gap:12px;background:rgba(201,169,97,.95);color:#14100a;border-radius:11px;
  padding:10px 12px 10px 15px;font-size:12px;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.5)}
#faixa.on{display:flex}
#faixa button{background:rgba(20,16,10,.17);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600}
body.mira #cv{cursor:crosshair}
.hot{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:1.5px solid rgba(248,246,240,.8);background:rgba(201,169,97,.18);backdrop-filter:blur(3px);
  cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;z-index:2}
.hot:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--marfim)}
.hot:hover{transform:scale(1.22);border-color:var(--ouro);background:rgba(201,169,97,.42)}
.hot.novo,.pin.novo{animation:pulsa 1.5s ease 2}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(201,169,97,.55)}50%{box-shadow:0 0 0 13px rgba(201,169,97,0)}}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:1.5px solid var(--ouro);background:rgba(11,13,17,.72);backdrop-filter:blur(4px);
  cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;z-index:2}
.pin:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ouro)}
.pin:hover{transform:scale(1.25);background:rgba(201,169,97,.34)}
#mcard{position:absolute;width:230px;background:rgba(11,13,17,.9);backdrop-filter:blur(14px);
  border:1px solid var(--linha);border-radius:13px;padding:14px 15px;z-index:4;display:none;
  box-shadow:0 14px 40px rgba(0,0,0,.55)}
#mcard .x{position:absolute;top:7px;right:9px;color:#5c6474;font-size:15px;line-height:1}
#mcard .x:hover{color:var(--marfim)}
#mcard .nm{font-family:Georgia,serif;font-size:14px;padding-right:14px;line-height:1.3}
#mcard .pz{font-family:Georgia,serif;font-size:20px;color:var(--ouro);margin:9px 0 8px}
#mcard .cta{display:block;width:100%;padding:9px;border-radius:8px;font-size:11px;
  background:linear-gradient(135deg,#C9A961,#a8873f);color:#14100a;font-weight:600}
.etapas{margin-top:12px}
.etapa{display:flex;align-items:center;gap:9px;font-size:11px;padding:5px 0;color:#5c6474}
.etapa .b{width:14px;height:14px;flex:0 0 14px;border-radius:50%;border:1.5px solid #2b3242}
.etapa.on{color:var(--marfim)}
.etapa.on .b{border-color:var(--ouro);background:rgba(201,169,97,.25)}
.etapa.ok{color:var(--verde)}
.etapa.ok .b{border-color:var(--verde);background:var(--verde)}
#ajuda{position:absolute;right:16px;bottom:52px;max-width:238px;background:rgba(11,13,17,.82);
  backdrop-filter:blur(10px);border:1px solid var(--linha);border-radius:11px;padding:13px 15px;
  font-size:10.5px;line-height:1.75;color:#8f98a8;z-index:3;display:none}
#ajuda.on{display:block}
#ajuda b{color:var(--marfim)}
#puxar{position:absolute;left:0;top:50%;transform:translateY(-50%);width:16px;height:64px;
  background:var(--onix2);border:1px solid var(--linha);border-left:none;border-radius:0 8px 8px 0;
  display:flex;align-items:center;justify-content:center;color:var(--cinza);font-size:11px;z-index:4}
#puxar:hover{color:var(--ouro)}
body.visitante #lado,body.visitante #puxar{display:none}
@media(max-width:860px){#lado{position:absolute;height:100%;box-shadow:0 0 40px rgba(0,0,0,.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <button class="tb" id="btAndar">Caminhar</button>

</div>
<input type="file" id="fFotos" accept="image/*" multiple style="display:none">
<input type="file" id="fSplat" accept=".splat,.ply,.ksplat" style="display:none">

<script>
window.__WS_ERR=[];
addEventListener('error',e=>window.__WS_ERR.push((e.message||'erro')+' @ '+(e.filename||'').split('/').pop()));
addEventListener('unhandledrejection',e=>window.__WS_ERR.push('promise: '+(e.reason&&e.reason.message||e.reason)));
setTimeout(function(){
  if(window.__WS_OK) return;
  var e=document.getElementById('cargaE'); e.style.display='block';
  e.textContent='O motor não iniciou em 25 segundos.\n\n'+
   '1. O ambiente vem por streaming e pode ser grande — em 4G demora.\n'+
   '2. O motor de splats (Spark) e o Three.js vêm de CDN.\n'+
   '3. Firewall bloqueando esm.sh ou unpkg.com.\n'+
   '4. WebGL2 desativado (teste em about:gpu).\n\n'+
   'Erros: '+(window.__WS_ERR.length?window.__WS_ERR.join(' · '):'nenhum capturado');
},25000);
</script>

<!-- ───────────────────────────────────────────────────────────────────────────
  INTEGRIDADE DOS SCRIPTS DE CDN

  Módulos ES não aceitam o atributo `integrity=` — o especificador é resolvido
  pelo mapa, não por uma tag <script>. O mecanismo correto é o campo
  `integrity` do próprio import map, e é o que está abaixo.

  Os hashes cobrem o fecho completo do que esta página importa: three, os dois
  loaders e os dois utilitários que o GLTFLoader puxa por dentro. Navegador que
  ainda não entende `integrity` no import map simplesmente ignora o campo e
  carrega como antes — é melhoria progressiva, não quebra nada.

  DUAS RESSALVAS HONESTAS:

  1. `@sparkjsdev/spark@2` virou `@2.1.0`. A faixa `@2` resolvia para a última
     2.x, e travar hash de faixa móvel é contradição: o hash quebra no dia em
     que o esm.sh publicar a 2.2. Versão exata é o que torna o hash verdadeiro.

  2. O hash do Spark cobre o SHIM do esm.sh (109 bytes), que reexporta do
     módulo real em `/@sparkjsdev/spark@2.1.0/…/spark.mjs`. Esse segundo salto
     NÃO está coberto. Proteção parcial — e a razão pela qual auto-hospedar as
     bibliotecas continua sendo a recomendação da auditoria, não uma
     alternativa equivalente. Rode `node 07-referencia/vendorizar.mjs` para
     baixar tudo para 02-camadas/vendor/ e trocar o mapa.

  Fora do alcance do import map: o decodificador Draco (WASM, buscado em
  runtime pelo DRACOLoader) e os mundos .rad do CDN. Os dois precisam de
  Content-Type e CORS corretos na origem, não de SRI.
──────────────────────────────────────────────────────────────────────────── -->

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';

/* ===========================================================================
   WS WALKTHROUGH — mundo navegável em Gaussian splat
   O splat entrega a fotografia. O colisor invisível entrega a geometria.
   O olho vê um; o sistema mede o outro.
   Vários ambientes convivem: passagens levam de um para o outro, como portas.
   ========================================================================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cv=$('#cv'), visor=$('#visor'), corpo=$('#corpo');

/* ---- acervo de ambientes. Endereços ficam no código, nunca na tela. ---- */
/* Acervo de ambientes. Todos por HTTPS: a plataforma é 100% web, nada de
   arquivo local. Cada mundo tem RAD (o que o olho vê) e colisor invisível
   (o que o sistema mede) — os dois sob o mesmo transform raiz.            */
const AMBIENTES=[
{
  id:'sala-integrada',
  nome:'Sala integrada',
  formato:'rad',
  rad:'https://cdn.mint.gg/rad/s-o-paulo-living-room-76448812ae8c6e84-lod.rad',
  colisor:'https://cdn.mint.gg/worlds/sao-paulo-living-room-collider-e27d5e1f12121894.glb',
  capa:'https://cdn.mint.gg/worlds/sao-paulo-living-room-thumbnail-e749499dd08d423f.webp',
  bytes:42269712, gerado:true,
  cal:{rotY:Math.PI, escala:2.5, y:1.5}, passagens:[], pinos:[]
},
{
  id:'penthouse-marmore',
  nome:'Penthouse mármore',
  formato:'rad',
  rad:'https://cdn.mint.gg/rad/skyline-marble-penthouse-2250e478621f5a2f-lod.rad',
  colisor:'https://cdn.mint.gg/worlds/skyline-marble-penthouse-collider-3a573bb5d4cad1d8.glb',
  capa:'https://cdn.mint.gg/worlds/skyline-marble-penthouse-thumbnail-08c38023cc6d95ed.webp',
  bytes:42845544, gerado:true,
  cal:{rotY:Math.PI, escala:2.5, y:1.5}, passagens:[], pinos:[]
},
{
  id:'apto-lancamento',
  nome:'Apartamento lançamento',
  formato:'rad',
  rad:'https://cdn.mint.gg/rad/brazilian-modern-penthouse-095638020a66bcd0-lod.rad',
  colisor:'https://cdn.mint.gg/worlds/brazilian-modern-penthouse-collider-99ff0aced25062bb.glb',
  capa:'https://cdn.mint.gg/worlds/brazilian-modern-penthouse-thumbnail-9f1e2d9df4d3b745.webp',
  bytes:44135800, gerado:true,
  cal:{rotY:Math.PI, escala:2.5, y:1.5}, passagens:[], pinos:[]
}];

/* Orçamento de gaussianas por degrau de qualidade. O Spark mira 2.500.000 no
   desktop; "Máxima" pede mais e desliga a foveação, que é o que borrava a
   periferia e o que ficava atrás. Nada aqui desliga o LOD — ver comentário
   em abrirAmbiente(). */
const QUALIDADE={
  maxima:    {orcamento:4200000, atras:1.0,  periferia:1.0,  pixel:2.0,  rotulo:'Máxima',    nota:'4,2 M de gaussianas · sem foveação'},
  equilibrio:{orcamento:2500000, atras:0.55, periferia:0.75, pixel:1.6,  rotulo:'Equilíbrio',nota:'2,5 M · foveação leve'},
  celular:   {orcamento:1200000, atras:0.2,  periferia:0.4,  pixel:1.25, rotulo:'Celular',   nota:'1,2 M · prioriza fluidez'}
};
const EST={aba:'ambientes', qualidade:'maxima', atual:0, visitante:false, ajuda:false,
  modo:null /* 'medir' | 'passagem' */, malha:false, aviso:null};
const CRIAR={fotos:[], prompt:'', nome:'', estado:'ocioso', msg:'', etapa:0, decorrido:0, timer:null};
const ETAPAS=['enviando fotos e descrição','gerando a prévia',
  'construindo o mundo em splat','pós-processamento e colisor','baixando para o visor'];
const CUSTO_MUNDO=1500;   /* créditos por ambiente final, conferidos ao vivo */

function passo(t,p){ $('#cargaT').textContent=t; $('#cargaB').style.width=(p*100)+'%'; }
function falhou(t){ const e=$('#cargaE'); e.style.display='block'; e.textContent=t;
  $('#cargaT').textContent='não consegui abrir o ambiente'; }
function aviso(t,tipo){ EST.aviso=t?{t,tipo}:null; painel(); }
function hud(msg){ $('#hud').innerHTML='<div class="p">'+msg+'</div><div class="p" id="pFps">—</div>'; }

/* ---------------------------------------------------------------- renderer */
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false}); }
catch(e){ falhou('WebGL indisponível: '+e.message); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x05070a,1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(55,1,0.01,2000);
cam.position.set(0,2.2,6);
function redim(){ const w=visor.clientWidth,h=visor.clientHeight;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
addEventListener('resize',redim);

/* ---------------------------------------------------- câmera e caminhada */
const ctl={yaw:0,pitch:0,orbita:true,alvo:new THREE.Vector3(0,1.4,0),dist:6,
  arrast:false,px:0,py:0,vy:0,vp:0};
const ANDAR={vel:new THREE.Vector3(),fase:0,bob:0,lat:0,
  conforto:matchMedia('(prefers-reduced-motion: reduce)').matches};
const tecla={};
addEventListener('keydown',e=>{ if(e.target.matches('input,textarea,select'))return;
  tecla[e.code]=true; if(e.code==='Space')e.preventDefault(); });
addEventListener('keyup',e=>tecla[e.code]=false);
addEventListener('blur',()=>{for(const k in tecla) tecla[k]=false;});
cv.addEventListener('pointerdown',e=>{ctl.arrast=true;ctl.px=e.clientX;ctl.py=e.clientY;
  cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{ if(!ctl.arrast)return;
  ctl.vy+=-(e.clientX-ctl.px)*0.0032; ctl.vp+=(ctl.orbita?1:-1)*(e.clientY-ctl.py)*0.0032;
  ctl.px=e.clientX; ctl.py=e.clientY; });
addEventListener('pointerup',()=>ctl.arrast=false);
cv.addEventListener('wheel',e=>{e.preventDefault();
  if(ctl.orbita) ctl.dist=clamp(ctl.dist*(1+Math.sign(e.deltaY)*0.11),0.6,120);
  else{ cam.fov=clamp(cam.fov+Math.sign(e.deltaY)*3,30,90); cam.updateProjectionMatrix(); }
},{passive:false});
function aplicarCam(){
  ctl.pitch=clamp(ctl.pitch,-1.45,1.45);
  if(ctl.orbita){
    const cp=Math.cos(ctl.pitch);
    cam.position.set(ctl.alvo.x+ctl.dist*cp*Math.sin(ctl.yaw),
      ctl.alvo.y+ctl.dist*Math.sin(ctl.pitch), ctl.alvo.z+ctl.dist*cp*Math.cos(ctl.yaw));
    cam.lookAt(ctl.alvo);
  } else cam.quaternion.setFromEuler(new THREE.Euler(ctl.pitch,ctl.yaw,0,'YXZ'));
}

/* ------------------------------------------------------- vigia de tela preta
   Regra: o sistema nunca entrega uma tela preta calada. Depois que o ambiente
   se declara pronto, lemos o miolo do quadro. Se em 6 segundos nada acendeu,
   dizemos o que houve e oferecemos a saída — em vez de deixar o usuário
   olhando para o vazio sem saber se é a internet, a placa ou o nosso código. */
const VIGIA={ativo:false, t:0, aceso:false, pico:0};
function vigiaArmar(){ VIGIA.ativo=true; VIGIA.t=0; VIGIA.aceso=false; VIGIA.pico=0; }
function brilhoDoMiolo(){
  try{
    const gl=renderer.getContext();
    const L=48, x=Math.max(0,(cv.width>>1)-(L>>1)), y=Math.max(0,(cv.height>>1)-(L>>1));
    const px=new Uint8Array(L*L*4);
    gl.readPixels(x,y,L,L,gl.RGBA,gl.UNSIGNED_BYTE,px);
    let pico=0;
    for(let i=0;i<px.length;i+=4){ const v=px[i]+px[i+1]+px[i+2]; if(v>pico) pico=v; }
    return pico;                       /* fundo é 0x05070a → soma 22 */
  }catch(e){ return -1; }              /* leitura indisponível: não acusa nada */
}
function vigia(dt){
  if(!VIGIA.ativo) return;
  VIGIA.t+=dt;
  if(VIGIA.t<1.2) return;              /* dá tempo do primeiro nível de páginas chegar */
  const pico=brilhoDoMiolo();
  if(pico<0){ VIGIA.ativo=false; return; }
  if(pico>VIGIA.pico) VIGIA.pico=pico;
  if(VIGIA.pico>40){ VIGIA.ativo=false; VIGIA.aceso=true; return; }
  if(VIGIA.t<6) return;
  VIGIA.ativo=false;
  const a=AMBIENTES[EST.atual]||{};
  const n=(splat&&(splat.numSplats??splat.packedSplats?.numSplats))||0;
  falhou('O ambiente carregou, mas nada foi desenhado na tela.\n\n'+
    'Gaussianas ativas neste instante: '+n+'\n'+
    'Qualidade: '+((QUALIDADE[EST.qualidade]||{}).rotulo||EST.qualidade)+'\n'+
    'Colisor: '+(malhas.length?malhas.length+' malhas (a geometria chegou)':'nenhum')+'\n\n'+
    (n===0
      ? 'Zero gaussianas com o colisor presente significa que as páginas do\n'+
        'arquivo não foram buscadas. Recarregue a página: a política de\n'+
        'streaming é fixada quando o motor é criado.'
      : 'Há gaussianas carregadas, então o problema é de câmera ou de recorte.\n'+
        'Zere o recorte em Ajustes e volte a calibração ao padrão.'));
  $('#carga').style.display='flex';
}

/* ------------------------------------------------- carregamento do ambiente */
let Spark=null, spark=null;
const raiz=new THREE.Group(); scene.add(raiz);
let splat=null, colisor=null, malhas=[], chaoY=0;

function aplicarCalibracao(){
  const a=AMBIENTES[EST.atual]; if(!a) return;
  raiz.rotation.set(Math.PI, a.cal.rotY, 0);
  raiz.scale.setScalar(a.cal.escala);
  raiz.position.set(0,a.cal.y,0);
  raiz.updateMatrixWorld(true);
}
function limparAmbiente(){
  if(splat){ raiz.remove(splat); splat.dispose?.(); splat=null; }
  if(colisor){ raiz.remove(colisor); colisor=null; }
  malhas=[]; limparMedida(); $$('.hot,.pin').forEach(n=>n.remove()); fecharCard();
}

async function abrirAmbiente(i){
  const a=AMBIENTES[i]; if(!a) return;
  EST.atual=i;
  $('#carga').style.display='flex'; $('#cargaE').style.display='none';
  passo('carregando o motor de splats',0.08);
  if(!Spark){
    try{ Spark=await import('@sparkjsdev/spark'); }
    catch(e){ falhou('Não consegui carregar o motor de splats (Spark).\n\n'+
      'Ele vem de CDN e exige Three.js 0.180 ou mais novo.\n\nDetalhe: '+(e.message||e)); return; }
  }
  /* ---- POR QUE enableLod NUNCA PODE SER false AQUI -----------------------
     Os mundos vêm em RAD paginado (arquivo "-lod.rad"). No Spark 2.1 o
     construtor faz  enableDriveLod = opts.enableDriveLod ?? enableLod  e o
     laço só chama driveLod() quando enableDriveLod é verdadeiro. É driveLod
     que escolhe e busca as páginas do arquivo. Com enableLod:false nenhuma
     página é buscada: a nuvem fica vazia e a tela fica PRETA — enquanto o
     colisor, que é Three.js puro, continua aparecendo. Foi exatamente esse
     o defeito relatado.
     Qualidade se controla pelo ORÇAMENTO de gaussianas e pela foveação,
     não desligando o LOD. É o que a tabela abaixo faz. */
  if(!spark){
    const q=QUALIDADE[EST.qualidade]||QUALIDADE.maxima;
    spark=new Spark.SparkRenderer({renderer,
      enableLod:true, enableDriveLod:true, enableLodFetching:true,
      lodSplatCount:q.orcamento,      /* padrão do Spark no desktop: 2.500.000 */
      behindFoveate:q.atras,          /* 1 = sem perda atrás da câmera (padrão 0,2) */
      coneFoveate:q.periferia,        /* 1 = sem perda na periferia (padrão 0,4) */
      minSortIntervalMs:0});
    scene.add(spark);
  }
  limparAmbiente();
  aplicarCalibracao();

  /* ---- o arquivo está mesmo acessível? ------------------------------------
     Mundo local aberto por duplo clique (file://) NÃO pode ser buscado por
     fetch: o navegador bloqueia. Em vez de morrer com "Failed to fetch",
     detectamos antes e oferecemos a saída. */
  const local = !/^https?:/i.test(a.rad);
  if(local && !a.blobUrl){   /* só acontece com arquivo que o usuário apontar */
    const arquivo = location.protocol==='file:';
    let alcancavel = !arquivo;
    if(!arquivo){
      try{ const r=await fetch(a.rad,{method:'GET',headers:{Range:'bytes=0-1'}});
           alcancavel = r.ok || r.status===206; }
      catch(e){ alcancavel=false; }
    }
    if(!alcancavel){
      $('#cargaE').style.display='block';
      $('#cargaT').textContent='este mundo precisa ser aberto do disco';
      $('#cargaE').innerHTML =
        '<b>"'+a.nome+'" é um arquivo local e o navegador não deixa buscá-lo daqui.</b>\n\n'+
        (arquivo
          ? 'A página foi aberta por duplo clique (file://). Um navegador nunca busca\n'+
            'arquivo local por fetch — é regra de segurança, não defeito nosso.\n\n'
          : 'O servidor não entregou o arquivo em <code>'+a.rad+'</code>.\n\n')+
        'Duas saídas, as duas funcionam agora:\n\n'+
        '  1. Rode um servidor na pasta e abra por ele:\n'+
        '     <code>python -m http.server 8080</code>\n\n'+
        '  2. Ou escolha o arquivo direto do seu computador:';
      const bt=document.createElement('button');
      bt.className='bt ouro'; bt.style.maxWidth='320px'; bt.style.marginTop='14px';
      bt.textContent='Escolher '+a.rad.split('/').pop()+' no computador';
      bt.onclick=()=>{ ARQ_ALVO=i; $('#fSplat').click(); };
      $('#cargaE').appendChild(bt);
      return;
    }
  }

  passo('baixando o ambiente · '+(a.bytes/1048576).toFixed(0)+' MB',0.2);
  const fonte = a.blobUrl || a.rad;
  const tipo = a.formato==='ply'   ? Spark.SplatFileType.PLY
             : a.formato==='splat' ? Spark.SplatFileType.SPLAT
             : Spark.SplatFileType.RAD;
  splat=new Spark.SplatMesh({url:fonte, fileType:tipo,
    paged:(a.formato==='rad'), raycastable:false, onFrame:()=>{}});
  raiz.add(splat);

  let gltf=null;
  if(a.colisor){
    const gl=new GLTFLoader();
    gl.setDRACOLoader(new DRACOLoader()
      .setDecoderPath('https://cdn.mint.gg/runtime/draco/gltf/three-0.184.0/'));
    try{
      const [,g]=await Promise.all([splat.initialized, gl.loadAsync(a.colisor)]);
      gltf=g;
    }catch(e){
      falhou('O ambiente ou o colisor não carregaram.\n\n'+
        'Sem o colisor não há colisão nem medição confiável — e derivar isso das\n'+
        'gaussianas produziria número errado, então o sistema para em vez de\n'+
        'mostrar medida em que ninguém pode confiar.\n\nDetalhe: '+(e.message||e)); return; }
  }else{
    try{ await splat.initialized; }
    catch(e){ falhou('O ambiente não carregou.\n\nDetalhe: '+(e.message||e)); return; }
  }

  malhas=[];
  if(gltf){
    passo('alinhando a malha de colisão',0.85);
    colisor=gltf.scene; raiz.add(colisor); raiz.updateMatrixWorld(true);
    colisor.traverse(n=>{ if(n.isMesh){ malhas.push(n); n.visible=EST.malha; } });
    const caixa=new THREE.Box3().setFromObject(colisor);
    const t=caixa.getSize(new THREE.Vector3());
    if(isFinite(t.x)&&t.lengthSq()>0.001){
      ctl.alvo.copy(caixa.getCenter(new THREE.Vector3()));
      chaoY=caixa.min.y; ctl.alvo.y=chaoY+1.4;
      a.medido={l:t.x,a:t.y,p:t.z};
    }
  }else{
    /* Captura solta: sem colisor. O chão vira um plano estimado pela nuvem, e a
       MEDIÇÃO FICA DESLIGADA — plano estimado não é geometria medida. */
    passo('estimando o piso da captura',0.85);
    raiz.updateMatrixWorld(true);
    let cx=new THREE.Box3();
    try{ cx=splat.getBoundingBox(false).clone().applyMatrix4(splat.matrixWorld); }catch(e){}
    const t=cx.getSize(new THREE.Vector3());
    if(isFinite(t.x)&&t.lengthSq()>0.001){
      const c=cx.getCenter(new THREE.Vector3());
      ctl.alvo.copy(c); chaoY=cx.min.y+t.y*0.06; ctl.alvo.y=chaoY+1.4;
      ctl.dist=Math.max(3,Math.hypot(t.x,t.z)*0.55);
      a.limite={x:[cx.min.x,cx.max.x],z:[cx.min.z,cx.max.z],yTeto:cx.max.y};
      a.medido={l:t.x,a:t.y,p:t.z};
    }
  }
  $('#cap').textContent=a.nome;
  hud('ambiente pronto');
  $('#carga').style.display='none';
  window.__WS_OK=true;
  /* o cronômetro do cômodo começa quando a cena aparece, não quando o download
     começa: esperar 40 MB não é visitar o ambiente */
  atencaoEntrar(a.id);
  vigiaArmar();
  /* só depois de a cena estar visível: recorte é enfeite, não pode bloquear */
  setTimeout(()=>{ try{ aplicarRecorte(); }catch(e){} },60);
  pinosRender(); painel();
}

/* ------------------------------------------------ colisão e leitura do chão */
const ray=new THREE.Raycaster();
const BAIXO=new THREE.Vector3(0,-1,0);
function alturaDoChao(x,z){
  if(!malhas.length) return null;
  ray.set(new THREE.Vector3(x,chaoY+6,z),BAIXO); ray.far=16;
  const h=ray.intersectObjects(malhas,true);
  return h.length? h[0].point.y : null;
}
function bloqueado(de,dir,dist){
  if(!malhas.length) return false;
  ray.set(de,dir); ray.far=dist;
  return ray.intersectObjects(malhas,true).length>0;
}
function mirar(ev){
  const r=cv.getBoundingClientRect();
  const nd=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(nd,cam); ray.far=800;
  const h=ray.intersectObjects(malhas,true);
  return h.length? h[0] : null;
}

/* ------------------------------------------------------------ medição real */
const MEDIDA={pontos:[],linha:null,marcas:[]};
function limparMedida(){
  if(MEDIDA.linha){ scene.remove(MEDIDA.linha); MEDIDA.linha.geometry.dispose();
    MEDIDA.linha.material.dispose(); MEDIDA.linha=null; }
  MEDIDA.marcas.forEach(m=>{scene.remove(m);m.geometry.dispose();m.material.dispose();});
  MEDIDA.marcas=[]; MEDIDA.pontos=[];
}
function marca(p,cor){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.045,16,12),
    new THREE.MeshBasicMaterial({color:cor||0xC9A961,depthTest:false}));
  m.position.copy(p); m.renderOrder=20; scene.add(m); MEDIDA.marcas.push(m); return m;
}

/* --------------------------------------------- passagens entre ambientes -- */
function pinosRender(){
  $$('.hot,.pin').forEach(n=>n.remove());
  fecharCard();
  const a=AMBIENTES[EST.atual]; if(!a) return;
  a.passagens.forEach((p,i)=>{
    const n=document.createElement('div'); n.className='hot'+(p.novo?' novo':'');
    const alvo=AMBIENTES.find(x=>x.id===p.destino);
    n.title=alvo?('ir para '+alvo.nome):'escolha o destino na lista';
    n.onclick=ev=>{ ev.stopPropagation();
      const j=AMBIENTES.findIndex(x=>x.id===p.destino);
      if(j>=0){ hud('atravessando…'); atravessar(j); }
      else hud('esta passagem ainda não tem destino'); };
    visor.appendChild(n); p.novo=false;
  });
  (a.pinos||[]).forEach((p,i)=>{
    const n=document.createElement('div'); n.className='pin'+(p.novo?' novo':'');
    n.title=p.movel.nome;
    n.onclick=ev=>{ ev.stopPropagation(); abrirCard(i); };
    visor.appendChild(n); p.novo=false;
  });
}
function proj(p,n){
  const v=new THREE.Vector3(p.x,p.y,p.z).project(cam);
  if(v.z>1){ n.style.display='none'; return null; }
  const r=cv.getBoundingClientRect();
  const x=(v.x*0.5+0.5)*r.width, y=(-v.y*0.5+0.5)*r.height;
  n.style.display='flex'; n.style.left=x+'px'; n.style.top=y+'px'; return {x,y,r};
}
function hotsPos(){
  const a=AMBIENTES[EST.atual]; if(!a) return;
  $$('.hot').forEach((n,i)=>{ const p=a.passagens[i]; if(p) proj(p,n); else n.style.display='none'; });
  $$('.pin').forEach((n,i)=>{ const p=(a.pinos||[])[i]; if(!p){n.style.display='none';return;}
    const xy=proj(p,n);
    if(cardAberto===i && xy){ const c=$('#mcard');
      c.style.left=clamp(xy.x+22,10,xy.r.width-250)+'px';
      c.style.top =clamp(xy.y-28,10,xy.r.height-140)+'px'; } });
}
let cardAberto=null;
const CART=[];
function abrirCard(i){
  cardAberto=i;
  const m=AMBIENTES[EST.atual].pinos[i].movel;
  const c=$('#mcard'); c.style.display='block';
  c.innerHTML='<button class="x" id="cardX">×</button>'+
    '<div class="nm">'+m.nome+'</div>'+
    '<div class="pz">'+(m.preco?m.preco.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}):'sob consulta')+'</div>'+
    '<button class="cta" id="cardAdd">'+(CART.find(x=>x.sku===m.sku)?'no carrinho ✓':'Adicionar ao carrinho')+'</button>';
  $('#cardX').onclick=fecharCard;
  $('#cardAdd').onclick=()=>{ if(!CART.find(x=>x.sku===m.sku)) CART.push({...m});
    $('#cardAdd').textContent='no carrinho ✓';
    enviarAoApp({tipo:'ws:carrinho', itens:CART});
    /* pôr algo no carrinho é o sinal de intenção mais forte da experiência:
       vale gravar a sessão junto, sem esperar o intervalo */
    sessaoEnviar(true); };
}
function fecharCard(){ cardAberto=null; const c=$('#mcard'); if(c) c.style.display='none'; }

/* atravessar uma porta: escurece, troca o mundo, volta. Corte seco quebra
   a sensação de continuidade — é a diferença entre porta e teletransporte. */
function atravessar(j){
  const v=document.createElement('div');
  v.style.cssText='position:absolute;inset:0;background:#05070a;opacity:0;z-index:7;'+
    'pointer-events:none;transition:opacity .32s ease';
  visor.appendChild(v);
  requestAnimationFrame(()=>v.style.opacity='1');
  setTimeout(async()=>{
    await abrirAmbiente(j);
    v.style.opacity='0';
    setTimeout(()=>v.remove(),420);
  },340);
}

/* ------------------------------------------------------------- clique 3D -- */
cv.addEventListener('click',ev=>{
  if(!EST.modo||!malhas.length) return;
  const h=mirar(ev);
  if(!h){ hud('clique sobre uma superfície do ambiente'); return; }
  const a=AMBIENTES[EST.atual];
  if(EST.modo==='medir'){
    if(MEDIDA.pontos.length>=2) limparMedida();
    MEDIDA.pontos.push(h.point.clone()); marca(h.point);
    if(MEDIDA.pontos.length===2){
      const [p1,p2]=MEDIDA.pontos;
      MEDIDA.linha=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]),
        new THREE.LineBasicMaterial({color:0xC9A961,depthTest:false}));
      MEDIDA.linha.renderOrder=20; scene.add(MEDIDA.linha);
      hud('distância '+p1.distanceTo(p2).toFixed(2)+' m · horizontal '+
        Math.hypot(p1.x-p2.x,p1.z-p2.z).toFixed(2)+' m · desnível '+Math.abs(p1.y-p2.y).toFixed(2)+' m');
    } else hud('clique no segundo ponto');
    return;
  }
  if(EST.modo==='passagem'){
    /* a passagem nasce mesmo sem destino: o pino aparece na hora e o destino
       é escolhido na lista. Antes ela era recusada quando só havia um ambiente,
       e o usuário clicava sem ver nada acontecer. */
    const outros=AMBIENTES.filter(x=>x.id!==a.id);
    a.passagens.push({x:h.point.x,y:h.point.y+0.9,z:h.point.z,
      destino:outros.length?outros[0].id:null, novo:true});
    aviso(outros.length?'Passagem criada. Escolha o destino na lista ao lado.'
      :'Passagem criada, ainda sem destino. Crie um segundo ambiente para ligá-la.','ok');
  } else if(EST.modo==='movel'){
    a.pinos.push({x:h.point.x,y:h.point.y+0.35,z:h.point.z, novo:true,
      movel:{nome:'Móvel sem nome',preco:0,sku:'p'+Date.now().toString(36)}});
    aviso('Pino de móvel criado. Dê nome e preço na lista ao lado.','ok');
  }
  modeloMudou();
  pinosRender(); modo(null);
});

function modo(m){
  if(m==='medir' && !malhas.length){
    aviso('Medição indisponível neste ambiente: ele é uma captura solta, sem malha '+
      'de colisão. O piso aqui é <b>estimado</b>, e medida estimada não vale para '+
      'imóvel. Ambientes com colisor liberam a fita métrica.','err');
    return;
  }
  EST.modo=m;
  document.body.classList.toggle('mira',!!m);

function pedido(){
  return {tipo:'ws:pedido-mundo', versao:1,
    nome:CRIAR.nome||'Ambiente sem nome',
    prompt:CRIAR.prompt.trim(),
    imagens:CRIAR.fotos.map(f=>({arquivo:f.nome, bytes:f.bytes})),

    custoEstimadoCreditos:CUSTO_MUNDO,
    observacao:'Ambiente gerado. Não representa imóvel real à venda.'};
}
async function gerarMundo(){
  const ep=window.WS_MUNDO_ENDPOINT;
  const carga={...pedido(), imagensDados:CRIAR.fotos.map(f=>f.dado)};

  if(!ep){
    /* Sem função de servidor não existe geração — e fingir que existe é o pior
       dos mundos: o usuário fica esperando para sempre. Diz na hora.

       O que segue para a aplicação é o PEDIDO, nunca as fotos. `carga` carrega
       imagensDados: as fotos do imóvel inteiras, em base64. Isso saía daqui com
       destino '*' — qualquer página que embutisse a camada recebia as fotos do
       cliente. pedido() traz só nome, prompt, nomes de arquivo e tamanhos. */
    enviarAoApp({tipo:'ws:pedido-mundo', pedido:pedido()});
    CRIAR.estado='ocioso'; CRIAR.erro=true;
    CRIAR.msg='<b>Não há gerador ligado neste navegador.</b> A geração roda em '+
      'servidor, porque a chave não pode viver aqui. O pedido — sem as fotos — foi '+
      'avisado à plataforma; use <b>Exportar pedido</b> para levar o arquivo. '+
      'As fotos ficam neste navegador. Nada foi gerado nem cobrado.';
    painel(); return;
  }

  CRIAR.estado='gerando'; CRIAR.erro=false; CRIAR.msg=''; CRIAR.etapa=0; CRIAR.decorrido=0;
  clearInterval(CRIAR.timer);
  CRIAR.timer=setInterval(()=>{ CRIAR.decorrido++; if(EST.aba==='criar') painel(); },1000);
  painel();

  const encerra=(erro,msg)=>{ clearInterval(CRIAR.timer); CRIAR.estado='ocioso';
    CRIAR.erro=erro; CRIAR.msg=msg; painel(); };

  try{
    const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(carga)});
    if(!r.ok) throw new Error('o servidor respondeu '+r.status);
    let j=await r.json();
    CRIAR.etapa=1; painel();

    /* o servidor pode responder na hora ou devolver um jobId para acompanhar */
    if(j.jobId && !j.rad){
      const inicio=Date.now();
      while(Date.now()-inicio < 15*60*1000){
        await new Promise(res=>setTimeout(res,5000));
        const rr=await fetch(ep+'?job='+encodeURIComponent(j.jobId));
        if(!rr.ok) throw new Error('consulta falhou com '+rr.status);
        const st=await rr.json();
        if(typeof st.etapa==='number'){ CRIAR.etapa=clamp(st.etapa,0,ETAPAS.length-1); painel(); }
        if(st.erro) throw new Error(st.erro);
        if(st.rad){ j=st; break; }
      }
      if(!j.rad) throw new Error('a geração passou de 15 minutos sem concluir');
    }
    if(!j.rad||!j.colisor) throw new Error('resposta sem o ambiente ou sem o colisor');

    CRIAR.etapa=ETAPAS.length-1; painel();
    AMBIENTES.push({id:'ger-'+Date.now().toString(36), nome:carga.nome,
      rad:j.rad, colisor:j.colisor, capa:j.capa||'', bytes:j.bytes||0,
      gerado:true, cal:{rotY:Math.PI,escala:2.5,y:1.5}, passagens:[], pinos:[]});
    CRIAR.fotos=[];
    encerra(false,'Pronto. O ambiente entrou na lista e está abrindo.');
    EST.aba='ambientes'; sincronizarAbas();
    abrirAmbiente(AMBIENTES.length-1);
  }catch(e){
    encerra(true,'Falhou: '+e.message+'. Nenhum crédito foi consumido.');
  }
}

function aplicarRecorte(){
  /* Planos de corte mexem no material do splat, que é do Spark e não é nosso.
     Qualquer tropeço aqui não pode apagar a cena — por isso tudo é opcional,
     guardado e reversível. Foi exatamente isso que faltou na primeira versão. */
  try{
    const a=AMBIENTES[EST.atual];
    if(!splat||!a) return;
    const k=+a.crop||0;
    const mats=[].concat(splat.material||[]).filter(Boolean);
    if(k<=0.001){
      mats.forEach(m=>{ if('clippingPlanes' in m){ m.clippingPlanes=null; m.needsUpdate=true; } });
      renderer.localClippingEnabled=false;
      return;
    }
    let cx=null;
    try{ cx=splat.getBoundingBox(false); }catch(e){ return; }
    if(!cx) return;
    const t=cx.getSize(new THREE.Vector3()), c=cx.getCenter(new THREE.Vector3());
    if(!isFinite(t.x)||t.lengthSq()<0.001) return;
    splat.updateMatrixWorld(true);
    const P=THREE.Plane, V=THREE.Vector3;
    const mx=t.x*(0.5-k), mz=t.z*(0.5-k), my=t.y*(0.5-k*0.6);
    const planos=[
      new P(new V( 1,0,0), -(c.x-mx)), new P(new V(-1,0,0),  (c.x+mx)),
      new P(new V(0,0, 1), -(c.z-mz)), new P(new V(0,0,-1),  (c.z+mz)),
      new P(new V(0, 1,0), -(c.y-my)), new P(new V(0,-1,0),  (c.y+my))
    ].map(pl=>pl.applyMatrix4(splat.matrixWorld));
    let aplicou=false;
    mats.forEach(m=>{ if('clippingPlanes' in m){ m.clippingPlanes=planos; m.needsUpdate=true; aplicou=true; } });
    renderer.localClippingEnabled=aplicou;
    if(!aplicou) hud('este ambiente não aceita recorte — o material é do motor');
  }catch(e){
    console.warn('[WS] recorte ignorado:',e&&e.message);
    try{ renderer.localClippingEnabled=false; }catch(_){}
  }
}

  EST.malha=!EST.malha;

}

/* ==========================================================================
   CONTRATO DE MENSAGENS — o lado da camada
   ==========================================================================
   Antes desta seção o Walkthrough era a única camada surda do sistema: emitia
   três mensagens com destino '*' e não escutava nenhuma. Consequências reais,
   todas observadas:

     · o WsBridge esperava ws:pronto para sempre e a aplicação mostrava painel
       de erro por cima de um walkthrough que estava funcionando atrás;
     · ws:carregar-imovel ficava preso na fila do bridge e nunca chegava;
     · o portal mandava ws:entrar-walkthrough três vezes, ninguém escutava, e
       o visitante via a sala de demonstração de São Paulo enquanto o aviso na
       tela afirmava ser o imóvel que ele havia clicado — que é exatamente o
       mal-entendido que o selo de "representação ilustrativa" existe para
       impedir, não para legitimar.

   Regras aplicadas aqui:
     1. origem de saída sempre exata, nunca '*';
     2. origem de entrada conferida contra a lista, e e.source === parent;
     3. a lista é constante no código — nunca vem da URL. Origem lida de query
        seria escolhida pelo atacante que embutisse a camada, o que anularia a
        checagem inteira;
     4. embutido, o walkthrough NÃO abre mundo nenhum por conta própria: ele
        se anuncia e espera o imóvel. Abrir a demonstração enquanto o imóvel
        real não chega é o defeito descrito acima.
   ------------------------------------------------------------------------ */

const VERSAO_CONTRATO=1;
const CAMADA='walkthrough';

/* As origens das APLICAÇÕES que podem comandar esta camada. Duas marcas rodam
   o mesmo produto (White Stone e Mafuz) e as duas embutem as mesmas camadas.
   Constante no código de propósito — ver o cabeçalho desta seção. */
const ORIGENS_APP=[
  'https://whitestone.living',
  'https://www.whitestone.living',
  'https://mafuz.com.br',
  'https://www.mafuz.com.br',
  'https://staging.whitestone.living',
];
/* Em desenvolvimento a camada e a aplicação compartilham a origem. Só vale
   quando a própria camada está em localhost — nunca em produção. */
const EM_DEV=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const LOCAL=/^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$/;

/**
 * A origem pode comandar esta camada?
 *
 * Em produção: só a lista acima, exata.
 *
 * Em desenvolvimento: qualquer `localhost`, INCLUSIVE noutra porta. Isso não é
 * frouxidão — é o que permite rodar o arranjo que espelha produção, com a
 * aplicação num servidor e as camadas noutro. A versão anterior aceitava só
 * `location.origin`, que é a porta da CAMADA; com o app em outra porta ela
 * rejeitava todo comando e ficava "carregando" para sempre, e o desenvolvedor
 * era empurrado para o arranjo de mesma origem — justamente o que não pode ir
 * ao ar. A trava é o `EM_DEV`: em qualquer host publicado, isto não vale.
 */
function origemPermitida(o){
  if(ORIGENS_APP.includes(o)) return true;
  return EM_DEV && LOCAL.test(o);
}
/* Lista para EMISSÃO e para a mensagem de diagnóstico. Em dev inclui a própria
   origem, que cobre o caso de app e camada compartilharem servidor. */
const ORIGENS=EM_DEV ? ORIGENS_APP.concat(location.origin) : ORIGENS_APP;

const EMBUTIDO = parent!==window;

/* Para qual origem responder. O referrer dá o pai; só é aceito se estiver na
   lista. Sem referrer (alguns Referrer-Policy), emitimos para cada origem
   permitida: o navegador só entrega àquela que de fato for o pai. */
function origensDeSaida(){
  try{
    if(document.referrer){
      const o=new URL(document.referrer).origin;
      if(origemPermitida(o)) return [o];
    }
  }catch(e){}
  return ORIGENS;
}
const SAIDA=origensDeSaida();

function enviarAoApp(msg){
  if(!EMBUTIDO) return;
  const carga={...msg, v:VERSAO_CONTRATO, camada:CAMADA};
  for(const o of SAIDA){
    try{ parent.postMessage(carga,o); }catch(e){}
  }
}

/* ----------------------------------------------- o modelo autoral do tour --
   Passagens e pinos eram criados só na memória do objeto AMBIENTES: o corretor
   ligava sala → cozinha → suíte, nomeava e precificava os móveis, e perdia
   tudo no F5. Não havia caminho nenhum até o banco.

   O formato de fio achata o grafo — cada passagem carrega o ambiente de origem
   — porque é assim que ele vira linha de tabela sem precisar de aninhamento. */
function modeloDoWalkthrough(){
  const passagens=[], pinos=[];
  AMBIENTES.forEach(a=>{
    (a.passagens||[]).forEach(p=>passagens.push({
      de:a.id, para:p.destino||null, x:p.x, y:p.y, z:p.z }));
    (a.pinos||[]).forEach(p=>pinos.push({
      ambiente:a.id, x:p.x, y:p.y, z:p.z, movel:{...p.movel} }));
  });
  return {
    v:VERSAO_CONTRATO,
    ambientes:AMBIENTES.map(a=>({id:a.id, nome:a.nome, gerado:!!a.gerado,
      cal:{...a.cal}, crop:a.crop||0})),
    passagens, pinos,
  };
}
function aplicarModelo(m){
  if(!m || typeof m!=='object') return;
  /* calibração e recorte por ambiente */
  (m.ambientes||[]).forEach(x=>{
    const a=AMBIENTES.find(y=>y.id===x.id); if(!a) return;
    if(x.cal) a.cal={...a.cal,...x.cal};
    if(typeof x.crop==='number') a.crop=x.crop;
  });
  AMBIENTES.forEach(a=>{ a.passagens=[]; a.pinos=[]; });
  (m.passagens||[]).forEach(p=>{
    const a=AMBIENTES.find(y=>y.id===p.de); if(!a) return;
    a.passagens.push({x:p.x, y:p.y, z:p.z, destino:p.para||null});
  });
  (m.pinos||[]).forEach(p=>{
    const a=AMBIENTES.find(y=>y.id===p.ambiente); if(!a) return;
    a.pinos.push({x:p.x, y:p.y, z:p.z, movel:{...p.movel}});
  });
}

/* A autoria é episódica (clique, nomear, precificar). 1,5 s agrupa a rajada de
   digitação sem fazer o usuário esperar por um salvamento que ele não pediu. */
let tModelo=null;
function modeloMudou(){
  if(!EMBUTIDO) return;
  clearTimeout(tModelo);
  tModelo=setTimeout(()=>{
    enviarAoApp({tipo:'ws:walkthrough-modelo',
      imovelId:(IMOVEL&&IMOVEL.id)||null, modelo:modeloDoWalkthrough()});
  },1500);
}

/* ==========================================================================
   TELEMETRIA DE ATENÇÃO — quanto tempo a pessoa passou em cada cômodo
   ==========================================================================
   O Tour 360 media isso desde sempre; o Walkthrough não media nada. É a lacuna
   mais cara do sistema, porque o walkthrough é justamente a camada onde a
   pessoa PASSA TEMPO — e "88 segundos na sala, 41 na cozinha" é sinal de
   intenção qualitativamente diferente de "clicou no anúncio". Alimenta o WSI,
   a qualificação do lead e o motor de recomendação.

   Duas decisões que fazem a diferença entre medir e fingir que mede:

   1. O RELÓGIO PARA QUANDO A ABA SOME. Sem isso, uma aba esquecida aberta a
      noite inteira grava oito horas na sala e destrói o sinal de todos os
      outros imóveis na hora de comparar.

   2. O RELÓGIO PARA QUANDO NINGUÉM MEXE. Presença não é atenção. Sem teto de
      ociosidade, quem levanta para atender o telefone com o tour aberto vira o
      lead mais quente da base. 45 s sem nenhum input encerra o trecho; o
      próximo movimento começa outro.

   O que sai daqui é sempre segundos de atenção ATIVA, e é por isso que o
   número pode ser comparado entre imóveis. */

const ATENCAO={
  porAmbiente:Object.create(null),  /* id do ambiente -> segundos acumulados */
  atual:null,                       /* ambiente sendo cronometrado agora     */
  desde:0,                          /* performance.now() do trecho corrente  */
  ultimaAcao:0,                     /* último input do usuário               */
  contando:false,
};
const OCIOSO_APOS_MS=45000;

/**
 * Fecha o trecho corrente e o credita ao cômodo.
 *
 * `ate` é o instante em que a atenção terminou de verdade. Fechar por
 * ociosidade PRECISA passar um corte: sem isso o trecho é creditado até agora, e
 * os minutos de ausência que motivaram o fechamento entram como atenção — o
 * defeito volta inteiro, só que mais difícil de ver, porque o teto de
 * ociosidade parece estar lá.
 *
 * O corte é `última ação + carência`, nunca a última ação seca. Entrar num
 * cômodo e olhar em volta por vinte segundos sem tocar em nada É atenção —
 * cortar no último clique jogaria fora justamente a observação parada, que num
 * tour é o comportamento mais valioso que existe. A carência conta; o que vem
 * depois dela, não.
 */
function atencaoFechar(ate){
  if(!ATENCAO.contando||!ATENCAO.atual) return;
  const fim=Math.min(typeof ate==='number'?ate:performance.now(), performance.now());
  const s=(fim-ATENCAO.desde)/1000;
  if(s>0.25) ATENCAO.porAmbiente[ATENCAO.atual]=(ATENCAO.porAmbiente[ATENCAO.atual]||0)+s;
  ATENCAO.contando=false;
}
function atencaoAbrir(){
  if(ATENCAO.contando||!ATENCAO.atual) return;
  if(document.hidden) return;
  ATENCAO.desde=performance.now();
  ATENCAO.contando=true;
}
/* trocar de cômodo fecha o trecho anterior e abre o próximo */
function atencaoEntrar(id){
  if(id===ATENCAO.atual) return;
  atencaoFechar();
  ATENCAO.atual=id;
  ATENCAO.ultimaAcao=performance.now();
  atencaoAbrir();
}
function marcarAcao(){
  ATENCAO.ultimaAcao=performance.now();
  atencaoAbrir();                   /* voltou a mexer: retoma a contagem */
}
/* Um input qualquer conta como presença. `pointermove` só no canvas: mouse
   passeando pelo painel lateral não é atenção ao ambiente. */
['keydown','wheel','pointerdown'].forEach(e=>addEventListener(e,marcarAcao,{passive:true}));
cv.addEventListener('pointermove',marcarAcao,{passive:true});
addEventListener('blur',atencaoFechar);
addEventListener('focus',marcarAcao);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) atencaoFechar(); else marcarAcao();
});
/* o navegador pode encerrar a página sem aviso: pagehide é o último momento
   confiável para fechar o trecho e mandar o que foi medido */
addEventListener('pagehide',()=>{ atencaoFechar(); sessaoEnviar(true); });

function atencaoVigiar(){
  if(!ATENCAO.contando) return;
  /* credita até o fim da carência, não até agora — ver atencaoFechar */
  if(performance.now()-ATENCAO.ultimaAcao>OCIOSO_APOS_MS)
    atencaoFechar(ATENCAO.ultimaAcao+OCIOSO_APOS_MS);
}

/** Segundos por ambiente, com o trecho em curso somado sem fechá-lo. */
function atencaoAgora(){
  const fora={...ATENCAO.porAmbiente};
  if(ATENCAO.contando&&ATENCAO.atual){
    /* o vigia roda uma vez por segundo; entre duas passagens dele o trecho em
       curso pode já estar ocioso. Aplicar o mesmo corte aqui evita que uma
       leitura feita nesse intervalo reporte tempo que o vigia vai descartar. */
    const fim=Math.min(performance.now(), ATENCAO.ultimaAcao+OCIOSO_APOS_MS);
    const s=Math.max(0,fim-ATENCAO.desde)/1000;
    fora[ATENCAO.atual]=(fora[ATENCAO.atual]||0)+s;
  }
  /* nomes legíveis: quem consome o dado não deveria precisar do mapa de ids */
  const porNome={};
  for(const [id,s] of Object.entries(fora)){
    const a=AMBIENTES.find(x=>x.id===id);
    porNome[(a&&a.nome)||id]=Math.round(s);
  }
  return {porId:Object.fromEntries(Object.entries(fora).map(([k,v])=>[k,Math.round(v)])),
          porNome, total:Math.round(Object.values(fora).reduce((t,v)=>t+v,0))};
}

/* ------------------------------------------------------ sessão do visitante
   Onde a pessoa parou, o que olhou e o que colocou no carrinho. Diferente do
   modelo autoral: isto é descartável, mas é o que faz a segunda visita parecer
   continuação em vez de recomeço — e é o que a tabela walkthrough_sessoes
   recebe do lado da aplicação. */
let tSessao=0;
const SESSAO_INTERVALO_MS=15000;

function sessaoPacote(){
  const a=AMBIENTES[EST.atual]||{};
  const at=atencaoAgora();
  return {
    tipo:'ws:walkthrough-sessao',
    imovelId:(IMOVEL&&IMOVEL.id)||null,
    ambienteId:a.id||null,
    camera:{x:+cam.position.x.toFixed(3), y:+cam.position.y.toFixed(3),
            z:+cam.position.z.toFixed(3), yaw:+ctl.yaw.toFixed(4),
            pitch:+ctl.pitch.toFixed(4), orbita:ctl.orbita},
    atencao:at.porNome,
    atencaoPorId:at.porId,
    tempoTotalS:at.total,
    carrinho:CART.map(m=>({sku:m.sku, nome:m.nome, preco:m.preco})),
  };
}
function sessaoEnviar(agora){
  if(!EMBUTIDO) return;
  const t=performance.now();
  if(!agora && t-tSessao<SESSAO_INTERVALO_MS) return;
  /* nada medido ainda: não vale acordar a aplicação para dizer zero */
  const p=sessaoPacote();
  if(!agora && p.tempoTotalS<1) return;
  tSessao=t;
  enviarAoApp(p);
}

/* --------------------------------------------------- entrada de comandos -- */
let IMOVEL=null;

function formatoDaUrl(u){
  if(/\.rad(\?|$)/i.test(u)) return 'rad';
  if(/\.ply(\?|$)/i.test(u)) return 'ply';
  return 'splat';
}

/* Monta os ambientes de um imóvel vindo do banco e substitui o acervo de
   demonstração. `midia.ambientes` é o caso de vários cômodos ligados por
   passagens; `midia.splat` é o atalho de um cômodo só. */
function carregarImovel(msg){
  const im=msg.imovel||{}, md=msg.midia||{};
  const lista=Array.isArray(md.ambientes)&&md.ambientes.length
    ? md.ambientes
    : (md.splat ? [{id:'principal', nome:im.nome||'Ambiente',
        splat:md.splat, colisor:md.colisor, capa:md.capa,
        bytes:md.bytes, cal:md.cal, gerado:md.gerado}] : []);

  if(!lista.length){
    $('#carga').style.display='flex';
    falhou('O imóvel "'+(im.nome||im.id||'sem nome')+'" chegou sem mídia de walkthrough.\n\n'+
      'A aplicação enviou ws:carregar-imovel, mas sem midia.splat nem midia.ambientes.\n'+
      'Sem o arquivo do ambiente não há o que caminhar.\n\n'+
      'O sistema prefere dizer isso a abrir um ambiente de demonstração no lugar '+
      'do imóvel — mostrar outro espaço sob o nome deste seria pior que não mostrar nada.');
    return;
  }

  /* Imóvel novo, sessão nova. Sem zerar, o tempo do imóvel anterior seria
     somado ao próximo e os dois números ficariam errados de uma vez. */
  atencaoFechar();
  ATENCAO.porAmbiente=Object.create(null);
  ATENCAO.atual=null; tSessao=0;

  IMOVEL=im;
  AMBIENTES.length=0;
  lista.forEach((x,i)=>AMBIENTES.push({
    id:x.id||('amb-'+i), nome:x.nome||('Ambiente '+(i+1)),
    formato:formatoDaUrl(x.splat||''),
    rad:x.splat, colisor:x.colisor||'', capa:x.capa||'',
    bytes:x.bytes||0,
    /* sem declaração explícita, mídia vinda do banco é captura do imóvel real:
       é o padrão seguro — rotular captura como "gerado" só confunde, e rotular
       gerado como captura é o erro que o selo existe para evitar */
    gerado:x.gerado===true,
    cal:{rotY:Math.PI, escala:2.5, y:1.5, ...(x.cal||{})},
    passagens:[], pinos:[],
  }));

  if(msg.walkthrough) aplicarModelo(msg.walkthrough);

  EST.atual=0; EST.aba='ambientes'; sincronizarAbas();
  abrirAmbiente(0).catch(e=>falhou('Falha ao abrir o imóvel: '+(e.message||e)));
}

function tratarComando(msg){
  switch(msg.tipo){
    case 'ws:carregar-imovel':
    case 'ws:entrar-walkthrough':       /* o que o portal já emitia hoje */
      carregarImovel(msg); break;

    case 'ws:pedir-walkthrough':
      enviarAoApp({tipo:'ws:walkthrough-modelo',
        imovelId:(IMOVEL&&IMOVEL.id)||null, modelo:modeloDoWalkthrough()});
      break;

    case 'ws:pedir-sessao':
      /* a aplicação vai trocar de rota e quer gravar antes de desmontar o
         iframe — desmontar sem isso perde até 15 s de atenção medida */
      atencaoFechar();
      sessaoEnviar(true);
      break;

    case 'ws:ir-para':{
      const alvo=msg.alvo||{};
      const j=AMBIENTES.findIndex(a=>a.id===alvo.ambiente);
      if(j>=0 && j!==EST.atual) atravessar(j);
      else if(j<0 && alvo.ambiente) hud('ambiente "'+alvo.ambiente+'" não existe neste imóvel');
      break;
    }
    /* Regra 6 do contrato: comando desconhecido é ignorado em silêncio, para
       que uma aplicação nova não quebre uma camada velha. */
  }
}

addEventListener('message',e=>{
  if(!origemPermitida(e.origin)) return;
  if(e.source!==parent) return;
  const m=e.data;
  if(!m || typeof m!=='object') return;
  if(typeof m.tipo!=='string' || !m.tipo.startsWith('ws:')) return;
  try{ tratarComando(m); }
  catch(err){ console.warn('[WS] comando '+m.tipo+' falhou:',err&&err.message); }
});

/* ------------------------------------------------------------------ laço -- */
let ult=performance.now(), quadros=0, acum=0, relogio=0;
function laco(){
  requestAnimationFrame(laco);
  const agora=performance.now(), dt=Math.min((agora-ult)/1000,0.05); ult=agora;
  ctl.yaw+=ctl.vy; ctl.pitch+=ctl.vp; ctl.vy*=0.82; ctl.vp*=0.82;

  if(!ctl.orbita){
    const correndo=!!tecla.ShiftLeft, agachado=!!tecla.KeyC;
    const alvoVel=correndo?3.1:agachado?0.7:1.45;
    const f=new THREE.Vector3(); cam.getWorldDirection(f); f.y=0; f.normalize();
    const r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();
    const dir=new THREE.Vector3();
    if(tecla.KeyW) dir.add(f); if(tecla.KeyS) dir.sub(f);
    if(tecla.KeyA) dir.sub(r); if(tecla.KeyD) dir.add(r);
    const andando=dir.lengthSq()>0; if(andando) dir.normalize();
    ANDAR.vel.lerp(dir.multiplyScalar(alvoVel), Math.min(1,(andando?9:13)*dt));
    if(ANDAR.vel.lengthSq()<1e-5) ANDAR.vel.set(0,0,0);
    const passoV=ANDAR.vel.clone().multiplyScalar(dt);
    if(passoV.lengthSq()>0){
      const d=passoV.clone().normalize();
      if(malhas.length && bloqueado(cam.position.clone(),d,Math.max(0.4,passoV.length()+0.35)))
        ANDAR.vel.multiplyScalar(0.2);
      else cam.position.add(passoV);
    }
    /* sem colisor, a nuvem define até onde dá para andar */
    const lim=(AMBIENTES[EST.atual]||{}).limite;
    if(!malhas.length && lim){
      const f=0.6;
      cam.position.x=clamp(cam.position.x,lim.x[0]+f,lim.x[1]-f);
      cam.position.z=clamp(cam.position.z,lim.z[0]+f,lim.z[1]-f);
    }
    const chao=alturaDoChao(cam.position.x,cam.position.z);
    const alvoY=(chao!==null?chao:chaoY)+1.6+(agachado?-0.45:0);
    cam.position.y += (alvoY-cam.position.y)*Math.min(1,9*dt);
    const rapidez=ANDAR.vel.length();
    if(ANDAR.conforto){ ANDAR.bob=0; ANDAR.lat=0; }
    else{
      ANDAR.fase+=dt*(2.9+rapidez*1.35);
      const amp=Math.min(rapidez/3.1,1)*(agachado?0.014:0.028);
      ANDAR.bob=Math.abs(Math.sin(ANDAR.fase))*amp;
      ANDAR.lat=Math.sin(ANDAR.fase*0.5)*amp*0.55;
    }
  } else { ANDAR.vel.set(0,0,0); ANDAR.bob=0; ANDAR.lat=0; }

  aplicarCam();
  if(!ctl.orbita && (ANDAR.bob||ANDAR.lat)){
    const lado=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion);
    cam.position.y+=ANDAR.bob; cam.position.addScaledVector(lado,ANDAR.lat);
  }
  hotsPos();
  renderer.render(scene,cam);
  vigia(dt);

  quadros++; acum+=dt;
  if(acum>0.5){ const fps=quadros/acum; quadros=0; acum=0;
    const p=document.getElementById('pFps'); if(p) p.textContent=fps.toFixed(0)+' fps'; }

  /* Uma vez por segundo basta: o teto de ociosidade é de 45 s e a sessão sai a
     cada 15 s. Rodar isso a 60 fps seria 59 verificações jogadas fora por
     segundo dentro do laço que precisa caber em 16 ms. */
  relogio+=dt;
  if(relogio>=1){ relogio=0; atencaoVigiar(); sessaoEnviar(false); }
}

/* ---------------------------------------------------------------- partida --
   Solto, a camada abre o acervo de demonstração — é como ela é apresentada.
   Embutida, ela se anuncia e ESPERA o imóvel: baixar 42 MB de um ambiente de
   demonstração que será descartado assim que ws:carregar-imovel chegar custa
   dados do visitante e mostra o espaço errado no intervalo.                 */
redim(); sincronizarAbas(); painel(); laco();

if(!EMBUTIDO){
  hud('carregando');
  abrirAmbiente(0).catch(e=>falhou('Falha inesperada: '+(e.message||e)));
}else{
  /* o motor subiu; o que falta é dado. O vigia de 25 s não deve acusar. */
  window.__WS_OK=true;
  hud('aguardando o imóvel');
  passo('aguardando o imóvel da plataforma',0.05);
  enviarAoApp({tipo:'ws:pronto'});

  /* Se nada chegar, isto é uma falha de integração e precisa ser dita — não
     encoberta abrindo a demonstração, que foi o comportamento anterior. */
  setTimeout(()=>{
    if(IMOVEL) return;
    falhou('A camada subiu e anunciou ws:pronto, mas a aplicação não enviou nenhum imóvel em 20 segundos.\n\n'+
      'Verifique, nesta ordem:\n'+
      '  1. a aplicação escuta ws:pronto e só então envia ws:carregar-imovel\n'+
      '     (o ws-bridge.js já faz isso — ele enfileira até o handshake);\n'+
      '  2. a origem configurada no WsBridge é exatamente esta camada;\n'+
      '  3. esta camada aceita a origem da aplicação — a lista é ORIGENS_APP,\n'+
      '     constante no código desta página.\n\n'+
      'Origens aceitas aqui: '+ORIGENS.join(' · ')+'\n'+
      'Origem do pai (referrer): '+(document.referrer||'não informada'));
  },20000);
}

window.WS_WALK={AMBIENTES,EST,CRIAR,ANDAR,ctl,pedido,alturaDoChao,bloqueado,
  aplicarCalibracao,modeloDoWalkthrough,aplicarModelo,carregarImovel,ORIGENS};
</script>
